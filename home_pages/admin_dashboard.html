  <script>
    // Voir les détails d'un utilisateur
    window.viewUser = function (id) {
      const u = allUsersData.find(user => user.Id === id);
      if (u) {
        alert(`Détails Utilisateur :\n\nNom : ${u.Nom}\nPrénom : ${u.Prenom}\nEmail : ${u.Email}\nStatut : ${u.EstActif ? 'Actif' : 'Inactif'}`);
      }
    };

    // Modifier un utilisateur (exemple simple via prompt ou pré-remplissage)
    window.editUser = async function (id) {
      const u = allUsersData.find(user => user.Id === id);
      if (!u) return;

      // Saisie rapide des nouvelles informations
      const nouveauNom = prompt("Nom de l'utilisateur :", u.Nom || '');
      if (nouveauNom === null) return; // Annulation

      const nouveauPrenom = prompt("Prénom de l'utilisateur :", u.Prenom || '');
      if (nouveauPrenom === null) return;

      const nouvelEmail = prompt("Email de l'utilisateur :", u.Email || '');
      if (nouvelEmail === null) return;

      const estActif = confirm("L'utilisateur doit-il être actif ? (OK = Actif, Annuler = Inactif)");

      try {
        const res = await fetch(`http://localhost:3001/api/users/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nom: nouveauNom,
            prenom: nouveauPrenom,
            email: nouvelEmail,
            estActif: estActif
          })
        });


        const data = await res.json();

        if (data.success) {
          alert("Utilisateur modifié avec succès !");
          window.loadUsers(); // Rafraîchir le tableau
        } else {
          alert("Erreur lors de la modification : " + data.message);
        }
      } catch (err) {
        console.error("Erreur modification :", err);
        alert("Impossible de contacter le serveur.");
      }
    };

    // Supprimer un utilisateur
    window.deleteUser = async function (id) {
      if (!confirm("Voulez-vous vraiment supprimer cet utilisateur ? L'action est irréversible.")) return;

      try {
        const res = await fetch(`http://localhost:3001/api/users/${id}`, {
          method: 'DELETE'
        });
        const data = await res.json();

        if (data.success) {
          // Recharger la liste et mettre à jour le tableau
          window.loadUsers();
        } else {
          alert("Erreur lors de la suppression : " + data.message);
        }
      } catch (err) {
        console.error("Erreur suppression :", err);
        alert("Impossible de contacter le serveur.");
      }
    };
    async function fetchAdminStats() {
      try {
        const response = await fetch('http://localhost:3001/api/admin/statistics');
        const data = await response.json();

        if (data.success) {
          document.getElementById('stat-total-users').textContent = data.stats.totalUsers;
          document.getElementById('stat-presents-today').textContent = data.stats.presentsToday;
          document.getElementById('stat-presence-rate').textContent = `${data.stats.presenceRate}%`;
          document.getElementById('stat-active-sessions').textContent = data.stats.activeSessions;
        }
      } catch (err) {
        console.error("Erreur récupération stats :", err);
      }
    }
    // Charger et afficher les dernières sessions
    async function loadRecentSessions() {
      try {
        const response = await fetch('http://localhost:3001/api/sessions/recent');
        const data = await response.json();

        if (data.success && data.sessions) {
          const tbody = document.getElementById('recent-sessions-body');
          if (!tbody) return;

          tbody.innerHTML = data.sessions.map(s => {
            const dateFormatted = new Date(s.DateCreation).toLocaleString('fr-FR', {
              day: '2-digit', month: 'short', year: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });

            const isEnCours = s.EstActive === 1 || s.EstActive === true;

            const badge = isEnCours
              ? `<span style="background:#fff3cd; color:#856404; padding:4px 10px; border-radius:12px; font-weight:600; font-size:0.85em;">En cours</span>`
              : `<span style="background:#d4edda; color:#155724; padding:4px 10px; border-radius:12px; font-weight:600; font-size:0.85em;">Terminée</span>`;

            const action = isEnCours
              ? `<button onclick="closeSession(${s.Id})" style="cursor:pointer; border:none; background:#dc3545; color:white; border-radius:4px; padding:3px 8px;">Fermer</button>`
              : `<span style="color:#aaa;">—</span>`;

            return `
          <tr>
            <td><strong>${s.Titre}</strong> <br><small style="color:#666;">${s.Responsable || 'Admin'}</small></td>
            <td>${dateFormatted}</td>
            <td>${badge}</td>
            <td>${action}</td>
          </tr>
        `;
          }).join('');
        }
      } catch (err) {
        console.error("Erreur chargement récents :", err);
      }
    }
    // fermeture d'une session
    window.closeSession = async function (sessionId) {
      if (!confirm("Voulez-vous vraiment fermer cette session ?")) return;

      try {
        const response = await fetch('http://localhost:3001/api/sessions/close', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });

        const data = await response.json();

        if (data.success) {
          // Recharger immédiatement les stats et le tableau
          fetchAdminStats();
          loadRecentSessions();
        } else {
          alert("Erreur : " + data.message);
        }
      } catch (err) {
        console.error("Erreur lors de la fermeture :", err);
        alert("Impossible de contacter le serveur.");
      }
    };

 window.loadPage = async function(page, element) {

}

    // Gestion des onglets de la page Paramètres (settings.html)
    window.switchSettingsTab = function (tabName, btnElement) {
      // Boutons : gérer la classe active
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // Contenus : masquer tout, afficher le bon
      document.querySelectorAll('.settings-box').forEach(box => box.style.display = 'none');
      const target = document.getElementById('tab-' + tabName);
      if (target) target.style.display = 'block';
      //Si on affiche l'onglet Apparence, synchroniser les <select> avec le thème actuel
      if (tabName === 'apparence') syncAppearanceControls();

    };
    // THEME (clair / sombre) ET COULEUR PRINCIPALE
    // ======================================================
    window.applyTheme = function (value) {
      const theme = (value === 'Sombre') ? 'dark' : 'light';
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('sgip-theme', theme);
    };
    window.applyAccent = function (value) {
      const map = { 'Bleu': 'blue', 'Vert': 'green', 'Violet': 'violet' };
      const accent = map[value] || 'blue';
      document.body.setAttribute('data-accent', accent);
      localStorage.setItem('sgip-accent', accent);
    };

    // Remet les <select> de l'onglet Apparence sur la valeur actuellement active
    function syncAppearanceControls() {
      const themeSelect = document.getElementById('theme-select');
      const accentSelect = document.getElementById('accent-select');
      const theme = localStorage.getItem('sgip-theme') || 'light';
      const accent = localStorage.getItem('sgip-accent') || 'blue';

      if (themeSelect) themeSelect.value = (theme === 'dark') ? 'Sombre' : 'Clair';
      if (accentSelect) {
        const labelMap = { blue: 'Bleu', green: 'Vert', violet: 'Violet' };
        accentSelect.value = labelMap[accent] || 'Bleu';
      }
    }

    // Applique le thème et la couleur sauvegardés dès le chargement de la page
    (function initTheme() {
      const savedTheme = localStorage.getItem('sgip-theme') || 'light';
      const savedAccent = localStorage.getItem('sgip-accent') || 'blue';
      document.body.setAttribute('data-theme', savedTheme);
      document.body.setAttribute('data-accent', savedAccent);
    })();

  <script>
    window.openAddUserModal = function () {
      const modal = document.getElementById('addUserModal');
      if (modal) {
        document.getElementById('addUserForm')?.reset();
        modal.style.display = 'flex';
      } else {
        alert("Le modal 'addUserModal' est introuvable dans le code HTML.");
      }
    };

    window.closeAddUserModal = function () {
      const modal = document.getElementById('addUserModal');
      if (modal) {
        modal.style.display = 'none';
      }
    };
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');

    function openModal(titre, contenuHTML) {
      modalTitle.textContent = titre;
      modalBody.innerHTML = contenuHTML;
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
    }

    document.querySelector('.modal-close').onclick = closeModal;
    document.getElementById('modal-cancel').onclick = closeModal;
    window.onclick = (e) => { if (e.target == modal) closeModal(); }


    // Variable globale pour conserver la liste brute des utilisateurs
    let allUsersData = [];

    // Charger les utilisateurs depuis l'API
    window.loadUsers = async function () {
      try {
        const response = await fetch('http://localhost:3001/api/users/all');
        const data = await response.json();

        if (data.success && data.users) {
          allUsersData = data.users;
          renderUsersTable(allUsersData);
        }
      } catch (err) {
        console.error("Erreur chargement utilisateurs :", err);
      }
    };

    // Fonction de rendu du tableau
    function renderUsersTable(usersList) {
      const tbody = document.getElementById('users-table-body');
      if (!tbody) return;

      if (usersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 20px; color:#888;">Aucun utilisateur trouvé</td></tr>`;
        return;
      }

      tbody.innerHTML = usersList.map((u, index) => {
        const initial = (u.Prenom || u.Nom || 'U').charAt(0).toUpperCase();

        const presenceFormatted = u.DernierePresence
          ? new Date(u.DernierePresence).toLocaleString('fr-FR', {
            day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
          })
          : 'Aucune';

        const isActif = u.EstActif === 1 || u.EstActif === true;
        const badge = isActif
          ? `<span style="background:#e6f4ea; color:#137333; padding:4px 10px; border-radius:12px; font-weight:600; font-size:0.85em;">● Actif</span>`
          : `<span style="background:#fce8e6; color:#c5221f; padding:4px 10px; border-radius:12px; font-weight:600; font-size:0.85em;">● Inactif</span>`;

        return `
      <tr>
        <td>${index + 1}</td>
        <td>
          <div style="width:35px; height:35px; border-radius:50%; background:#4a6cf7; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.9em;">
            ${initial}
          </div>
        </td>
        <td><strong>${u.Nom || ''}</strong></td>
        <td>${u.Prenom || ''}</td>
        <td>${u.Email || ''}</td>
        <td>${badge}</td>
        <td>${presenceFormatted}</td>
        <td>
          <button onclick="window.viewUser('${u.Id}')" style="border:none; background:none; cursor:pointer; font-size:1.1em;" title="Voir">👁️</button>
          <button onclick="window.editUser('${u.Id}')" style="border:none; background:none; cursor:pointer; font-size:1.1em;" title="Modifier">✏️</button>
          <button onclick="window.deleteUser('${u.Id}')" style="border:none; background:none; cursor:pointer; font-size:1.1em; color:#dc3545;" title="Supprimer">🗑️</button>
        </td>
      </tr>
    `;
      }).join('');
    }

    // Fonction de filtrage appelée à chaque saisie
    window.filterUsers = function () {
      const searchInput = document.getElementById('user-search-input');
      const statusSelect = document.getElementById('user-status-filter');

      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const statusFilter = statusSelect ? statusSelect.value : 'tous';

      const filtered = allUsersData.filter(u => {
        // 1. Filtre Recherche Texte (Nom, Prénom, Email)
        const nom = (u.Nom || '').toLowerCase();
        const prenom = (u.Prenom || '').toLowerCase();
        const email = (u.Email || '').toLowerCase();
        const matchesText = nom.includes(query) || prenom.includes(query) || email.includes(query);

        // 2. Filtre Statut (Actif / Inactif)
        const isActif = u.EstActif === 1 || u.EstActif === true;
        let matchesStatus = true;

        if (statusFilter === 'actif') {
          matchesStatus = isActif;

    // ------------------------------------------------------------
    // Calcul des dates
    // ------------------------------------------------------------

    function getReportDates() {

      const period =
        document.getElementById('periodSelect')?.value;

      const today = new Date();

      let dateDebut;
      let dateFin;

      if (period === 'today') {

        dateDebut = new Date(today);

        dateFin = new Date(today);

      }

      else if (period === 'week') {

        dateFin = new Date(today);

        dateDebut = new Date(today);

        const day = dateDebut.getDay();

        const difference =
          day === 0 ? 6 : day - 1;

        dateDebut.setDate(
          dateDebut.getDate() - difference
        );

      }

      else if (period === 'month') {

        dateDebut = new Date(
          today.getFullYear(),
          today.getMonth(),
          1
        );

        dateFin = new Date(today);

      }

      else if (period === 'year') {

        dateDebut = new Date(
          today.getFullYear(),
          0,
          1
        );

        dateFin = new Date(today);

      }

      else if (period === 'custom') {

        const debut =
          document.getElementById('dateDebut')?.value;

        const fin =
          document.getElementById('dateFin')?.value;

        if (!debut || !fin) {
          return null;
        }

        return {
          dateDebut: debut,
          dateFin: fin
        };
      }

      return {
        dateDebut:
          dateDebut.toISOString().slice(0, 10),

        dateFin:
          dateFin.toISOString().slice(0, 10)
      };
    }

    async function loadMonthlyChart() {

      try {

        const response =
          await fetch(
            'http://localhost:3001/api/admin/statistics/monthly'
          );

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(data.message);
        }

        const chart =
          document.getElementById('monthlyChart');

        if (!chart) return;

        if (!data.data.length) {

          chart.innerHTML =
            '<p>Aucune donnée disponible.</p>';

          return;
        }

        const max =
          Math.max(
            ...data.data.map(item =>
              item.presences
            )
          );

        chart.innerHTML =
          data.data.map(item => {

            const height =
              max > 0
                ? Math.max(
                  10,
                  (item.presences / max) * 220
                )
                : 10;

            return `
          <div
            style="
              min-width:55px;
              height:250px;
              display:flex;
              flex-direction:column;
              justify-content:flex-end;
              align-items:center;
              gap:6px;
            "
          >

            <span
              style="
                font-size:12px;
                font-weight:bold;
              "
            >
              ${item.presences}
            </span>

            <div
              style="
                width:35px;
                height:${height}px;
                background:#4a6cf7;
                border-radius:6px 6px 0 0;
              "
            ></div>

            <span>
              ${item.mois}
            </span>

          </div>
        `;

          }).join('');

      }

      catch (error) {

        console.error(
          'Erreur graphique :',
          error
        );

      }
    }
